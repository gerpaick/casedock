<dialog
  id="keyboard-shortcuts-modal"
  class="shortcuts-modal"
  data-modal
  aria-labelledby="shortcuts-modal-title"
>
  <div class="shortcuts-modal__frame">
    <div class="shortcuts-modal__header">
      <div>
        <p class="eyebrow">Reference</p>
        <h3 id="shortcuts-modal-title">Keyboard shortcuts</h3>
      </div>
      <button type="button" class="button button-link" data-modal-dismiss>Close</button>
    </div>
    <div class="shortcuts-modal__body">
      <table class="shortcuts-table">
        <tbody>
          <tr>
            <td><kbd>c</kbd></td>
            <td>Capture inbox item (works anywhere)</td>
          </tr>
          <tr>
            <td><kbd>Ctrl</kbd> + <kbd>/</kbd></td>
            <td>Open this panel</td>
          </tr>
          <tr>
            <td><kbd>Ctrl</kbd> + <kbd>/</kbd>, then <kbd>h</kbd></td>
            <td>Page guide</td>
          </tr>
          <tr>
            <td><kbd>Esc</kbd></td>
            <td>Close modal / panel</td>
          </tr>
        </tbody>
      </table>
      <p class="shortcuts-modal__note muted">Press Esc to close. Page guides are available on key screens.</p>
    </div>
  </div>
</dialog>
