{% extends "ui/base.html" %}

{% block title %}Password updated{% endblock %}

{% block content %}
  <section class="page-head page-head--stacked">
    <div>
      <p class="eyebrow">Account</p>
      <h2>Password updated</h2>
    </div>
    <p class="page-copy">Your password has been changed. You can now sign in with the new password.</p>
  </section>

  <section class="panel">
    <div class="button-row">
      <a href="{% url 'login' %}" class="button">Sign in</a>
    </div>
  </section>
{% endblock %}
